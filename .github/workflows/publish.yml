name: Verify and publish PDF Smart Compressor V5 UAT Mode
on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'compat/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pdf-smart-compressor-pages
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack V3 source
        shell: bash
        run: |
          set -euo pipefail
          cat release/SOURCE_ARCHIVE.b64.part0{1..5} | base64 --decode > /tmp/pdf-v3-source.tar.xz
          echo "083aba509e54b1fd12a144df428fde2512ca666786c4bd61133e9c9c47f0669f  /tmp/pdf-v3-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/pdf-v3-source.tar.xz
          test -f src/index.html
          test -f src/app.mjs
          test -f tests/real-browser.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply V4 targeted compression source (verified archive patch)
        shell: bash
        run: |
          set -euo pipefail
          cat release/v4_patch.b64.part0{1..5} | base64 --decode > /tmp/v4-change.br
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {brotliDecompressSync} from 'node:zlib';
          writeFileSync('/tmp/v4-change.diff',brotliDecompressSync(readFileSync('/tmp/v4-change.br')));
          JS
          echo "b820e74c9e0df0291605ca6ae1dffde1b55d4a045a0bfc8f0dbaa073a1653117  /tmp/v4-change.diff" | sha256sum --check
          patch -p1 < /tmp/v4-change.diff
          grep -q 'high:10, balanced:30, small:50' src/app.mjs
          grep -q 'id="consent"' src/index.html
      - name: Apply V5 image-only scan DPI fallback
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode compat/v5-scanned-dpi.patch.br.b64 > /tmp/v5.patch.br
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {brotliDecompressSync} from 'node:zlib';
          writeFileSync('/tmp/v5.patch',brotliDecompressSync(readFileSync('/tmp/v5.patch.br')));
          JS
          patch --fuzz=0 -p1 < /tmp/v5.patch
          node --check src/app.mjs
          grep -q 'isSimpleImageOnlyScan' src/app.mjs
          grep -q 'RASTER_TRIALS' src/app.mjs
      - name: Integrate local-only Full UAT mode
        run: node compat/install-uat-mode.mjs
      - name: Install fixed-version dependencies
        run: npm install --ignore-scripts --no-fund
      - name: Install PDF.js browser-compatibility shim before build
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const shim = readFileSync('compat/pdfjs-map-shim.mjs', 'utf8');
          for (const path of [
            'node_modules/pdfjs-dist/build/pdf.mjs',
            'node_modules/pdfjs-dist/build/pdf.worker.mjs'
          ]) {
            const original = readFileSync(path, 'utf8');
            writeFileSync(path, shim + '\n' + original);
          }
          JS
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate and build
        run: npm run check && npm run test && npm run build
      - name: Install Chromium for real PDF UAT
        run: npx playwright install --with-deps chromium
      - name: Extend scanned-JPEG UAT to High and Small profiles
        run: node compat/extend-mode-tests.mjs
      - name: Verify V5 scanned PDF raster fallback in Chromium
        run: node compat/extend-v5-tests.mjs
      - name: Add UAT report / privacy browser tests
        run: node compat/extend-uat-tests.mjs
      - name: Real-browser regression tests
        run: npm run test:real
      - name: Full 29-case independent browser UAT
        run: node compat/full-uat-battery.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: verify-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
